name: Bootstrap Astro Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scaffolding Astro
        run: |
          # Generate template into a temporary directory so it doesn't fail on existing files
          npx create-astro@latest ./temp --template blog --no-install --yes
          # Copy generated files over, preserving existing workflow files
          cp -rn ./temp/* . || true
          cp -rn ./temp/.* . || true
          rm -rf ./temp
          npm install

      - name: Commit and Push Changes Back to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bootstrap Astro project files" || exit 0
          git push
